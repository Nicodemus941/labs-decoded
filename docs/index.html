<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Labs Decoded — your lab results, explained</title>
  <style>
    :root { --bg:#0b1020; --card:#121933; --text:#eef2ff; --muted:#b7c0e0; --accent:#7dd3fc; --border:#273056; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:linear-gradient(180deg,#0b1020 0%,#101935 100%); color:var(--text); line-height:1.6; }
    .wrap { max-width:960px; margin:0 auto; padding:64px 24px; }
    .hero, .section { background:rgba(18,25,51,.72); border:1px solid var(--border); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.22); }
    .hero { padding:48px; }
    .section { margin-top:40px; padding:32px; }
    h1 { margin:0 0 16px; font-size:clamp(2.2rem,5vw,4rem); line-height:1.05; }
    p.lead { margin:0; font-size:1.15rem; color:var(--muted); max-width:720px; }
    h2 { margin-top:0; font-size:1.5rem; }
    .placeholder { color:var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Labs Decoded — your lab results, explained</h1>
      <p class="lead">Clear, plain-English guidance for understanding common lab markers, what they may mean, and which questions are worth asking next.</p>
    </section>
    <section class="section">
      <h2>Articles</h2>
      <p class="placeholder">No articles yet.</p>
    </section>
  </main>
</body>
</html>
